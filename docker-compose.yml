services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres"]
        interval: 2s
        timeout: 5s
        retries: 15

  web:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/rails
    ports:
      - "3000:80"
    environment:
      RAILS_ENV: development
      DB_HOST: db
      LIBRARY_API_DATABASE_PASSWORD: postgres
      SOLID_QUEUE_IN_PUMA: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
